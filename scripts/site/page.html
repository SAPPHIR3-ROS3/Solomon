<!doctype html>
<html lang="{{.Language}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.MetadataTitle}} — Solomon Wiki</title>
<meta name="description" content="{{.Description}}">
<meta name="theme-color" content="#061c3b">
<link rel="canonical" href="{{.Canonical}}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="Solomon">
<meta property="og:title" content="{{.MetadataTitle}} — Solomon Wiki">
<meta property="og:description" content="{{.Description}}">
<meta property="og:url" content="{{.Canonical}}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{.MetadataTitle}} — Solomon Wiki">
<meta name="twitter:description" content="{{.Description}}">
<style>{{.CSS}}</style>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<header class="wiki-header"><a class="brand" href="{{.Home}}">Solomon</a><nav aria-label="Primary"><a href="{{.Home}}">Home</a><a href="{{.Index}}">Wiki index</a><a href="{{.Source}}">View source</a></nav></header>
<div class="wiki-layout">
<aside><details open><summary>Wiki navigation</summary><nav aria-label="Wiki pages"><ul>{{range .Navigation}}<li><a href="{{.URL}}"{{if .Current}} aria-current="page"{{end}}>{{.Title}}</a></li>{{end}}</ul></nav></details></aside>
<main id="main-content" tabindex="-1"><article>{{.Body}}</article><footer><a href="{{.Source}}">Edit the documentation source on GitHub</a></footer></main>
</div>
</body>
</html>
