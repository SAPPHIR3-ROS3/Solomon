name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "scripts/build_site.py"
      - "scripts/site/**"
      - "test/site_test.py"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "site/**"
      - "scripts/build_site.py"
      - "scripts/site/**"
      - "test/site_test.py"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Provision pinned renderer dependency
        run: go mod download github.com/yuin/goldmark
      - name: Test site renderer offline
        env:
          GOPROXY: 'off'
          GOTOOLCHAIN: local
          GOSUMDB: 'off'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s test -p site_test.py
      - name: Build static website and wiki offline
        run: python3 scripts/build_site.py --output "$RUNNER_TEMP/solomon-site" --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA" --base-url "https://sapphir3-ros3.github.io/Solomon/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/solomon-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
