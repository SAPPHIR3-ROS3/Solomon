name: Release

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      force_tests:
        description: Re-run the test suite even if this commit already passed CI
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  prior_test_status:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      skip_tests: ${{ steps.check.outputs.skip_tests }}
    steps:
      - uses: actions/checkout@v6
      - name: Check whether this commit already passed CI
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_TESTS: ${{ inputs.force_tests }}
        run: bash scripts/check_prior_ci_tests.sh

  test:
    needs: prior_test_status
    if: |
      always() && (
        github.event_name == 'push' ||
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'workflow_dispatch' && (
            needs.prior_test_status.result == 'skipped' ||
            needs.prior_test_status.outputs.skip_tests != 'true'
          )
        )
      )
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          check-latest: true
      - name: Build cursor integration bundle
        run: |
          go run scripts/cursor_bundler.go build
          go run scripts/cursor_bundler.go bundle

      - name: Build the daemon frontend
        shell: bash
        run: |
          go run ./scripts/npm_deps gui
          npm --prefix gui run build
          go run scripts/gui_bundle.go
      - run: go vet ./...
      - run: go run scripts/check_doc_paths.go
      - run: go run scripts/check_package_index.go
      - name: Verify install script GOPATH bin PATH setup (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/check_install_path.sh
      - name: Verify install script GOPATH bin PATH setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check_install_path.ps1
      - name: Verify upgrade restart flow
        shell: bash
        run: go test ./test -count=1 -run '^TestUpgradeFlow_'
      - name: Verify Windows desktop build and registration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build_desktop.ps1 -Install
          $key = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Solomon'
          if ($key.DisplayName -ne 'Solomon') { throw 'Solomon application registration missing' }
          $link = Join-Path ([Environment]::GetFolderPath('Programs')) 'Solomon\Solomon.lnk'
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($link)
          if (-not (Test-Path -LiteralPath $shortcut.TargetPath)) { throw 'Solomon Start menu target missing' }
      - name: Run tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            CGO_ENABLED=1 go test ./... -count=1 -race
          else
            go test ./... -count=1
          fi
      - name: Build solomon with embedded version metadata
        shell: bash
        run: |
          set -e
          if VERSION=$(git describe --tags --exact-match --match 'v*' 2>/dev/null); then
            :
          else
            BASE_VERSION=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo dev)
            VERSION="${BASE_VERSION}-dev"
          fi
          COMMIT=$(git rev-parse HEAD)
          COMMIT_TIME=$(git show -s --format=%cI HEAD)
          SOURCE_TREE=$(go run ./scripts/source_identity)
          COMMIT_TREE=$(git rev-parse 'HEAD^{tree}')
          go build -ldflags="-X github.com/SAPPHIR3-ROS3/Solomon/v2026/internal/agent/commands.version=${VERSION} -X github.com/SAPPHIR3-ROS3/Solomon/v2026/internal/agent/commands.commit=${COMMIT} -X github.com/SAPPHIR3-ROS3/Solomon/v2026/internal/agent/commands.commitTime=${COMMIT_TIME} -X github.com/SAPPHIR3-ROS3/Solomon/v2026/internal/agent/commands.sourceTree=${SOURCE_TREE} -X github.com/SAPPHIR3-ROS3/Solomon/v2026/internal/agent/commands.commitTree=${COMMIT_TREE}" ./cmd/solomon

  desktop_assets:
    if: |
      always() &&
      (needs.test.result == 'success' ||
       (needs.test.result == 'skipped' && needs.prior_test_status.outputs.skip_tests == 'true'))
    needs: [prior_test_status, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows/amd64
            asset: windows-amd64.exe
          - runner: windows-latest
            platform: windows/arm64
            asset: windows-arm64.exe
          - runner: ubuntu-24.04
            platform: linux/amd64
            asset: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            asset: linux-arm64
          - runner: macos-15-intel
            platform: darwin/amd64
            asset: darwin-amd64.app.tar.gz
          - runner: macos-15
            platform: darwin/arm64
            asset: darwin-arm64.app.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build Cursor integration bundle
        run: |
          go run scripts/cursor_bundler.go build
          go run scripts/cursor_bundler.go bundle
      - name: Build native desktop
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p desktop-dist
          cd gui/desktop
          wails_version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          flags=()
          if [[ "$PLATFORM" == linux/* ]]; then flags=(-tags webkit2_41); fi
          go run "github.com/wailsapp/wails/v2/cmd/wails@${wails_version}" build -skipbindings -nosyncgomod -m -platform "$PLATFORM" "${flags[@]}"
          if [[ "$PLATFORM" == darwin/* ]]; then
            COPYFILE_DISABLE=1 tar -czf "../../desktop-dist/solomon-desktop-${ASSET}" -C build/bin Solomon.app
          elif [[ "$PLATFORM" == windows/* ]]; then
            cp build/bin/solomon-desktop.exe "../../desktop-dist/solomon-desktop-${ASSET}"
          else
            cp build/bin/solomon-desktop "../../desktop-dist/solomon-desktop-${ASSET}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.asset }}
          path: desktop-dist/*

  release:
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.desktop_assets.result == 'success' &&
      (
        needs.test.result == 'success' ||
        (
          needs.test.result == 'skipped' &&
          needs.prior_test_status.outputs.skip_tests == 'true'
        )
      )
    needs: [prior_test_status, test, desktop_assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ver: ${{ steps.version.outputs.ver }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          check-latest: true

      - name: Build cursor integration bundle
        run: |
          go run scripts/cursor_bundler.go build
          go run scripts/cursor_bundler.go bundle

      - name: Build the daemon frontend
        shell: bash
        run: |
          go run ./scripts/npm_deps gui
          npm --prefix gui run build
          go run scripts/gui_bundle.go

      - id: version
        name: Resolve calendar version tag
        run: |
          set -e
          git fetch --tags origin
          Y=$(date -u +%Y)
          M=$((10#$(date -u +%m)))
          D=$((10#$(date -u +%d)))
          MD=$((M * 100 + D))
          PREFIX="v${Y}.${MD}"

          MAX_REV=-1
          for t in $(git tag -l "${PREFIX}.*"); do
            SUF=${t#"$PREFIX."}
            if [[ "$SUF" =~ ^[0-9]+$ ]] && ((10#$SUF > MAX_REV)); then
              MAX_REV=$((10#$SUF))
            fi
          done
          REV=$((MAX_REV + 1))
          VER="${PREFIX}.${REV}"

          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          VER: ${{ steps.version.outputs.ver }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VER" -m "Calendar release $VER"
          git push origin "$VER"
          echo "Pushed tag $VER"

      - name: Build release executables
        env:
          VER: ${{ steps.version.outputs.ver }}
        run: |
          set -e
          # Capture the source tree before creating release outputs or stamping versions.
          SOURCE_TREE=$(go run ./scripts/source_identity)
          COMMIT_TREE=$(git rev-parse 'HEAD^{tree}')
          COMMIT=$(git rev-parse HEAD)
          mkdir -p dist
          for spec in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            goos="${spec%/*}"
            goarch="${spec#*/}"
            out="dist/solomon-${VER}-${goos}-${goarch}"
            if [ "$goos" = "windows" ]; then
              out="${out}.exe"
            fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="-s -w -X github.com/SAPPHIR3-ROS3/Solomon/v2026/internal/agent/commands.version=$VER -X github.com/SAPPHIR3-ROS3/Solomon/v2026/internal/agent/commands.commit=$COMMIT -X github.com/SAPPHIR3-ROS3/Solomon/v2026/internal/agent/commands.sourceTree=$SOURCE_TREE -X github.com/SAPPHIR3-ROS3/Solomon/v2026/internal/agent/commands.commitTree=$COMMIT_TREE" -o "$out" ./cmd/solomon
          done

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop-dist
          merge-multiple: true

      - name: Collect native desktop executables
        env:
          VER: ${{ steps.version.outputs.ver }}
        run: |
          set -e
          for asset in desktop-dist/solomon-desktop-*; do
            suffix=${asset##*/solomon-desktop-}
            cp "$asset" "dist/solomon-desktop-${VER}-${suffix}"
          done

      - name: Generate release checksums
        env:
          VER: ${{ steps.version.outputs.ver }}
        run: |
          set -e
          (
            cd dist
            sha256sum solomon-* > checksums.txt
          )

      - name: Create GitHub release
        env:
          VER: ${{ steps.version.outputs.ver }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release create "$VER" dist/* \
            --title "$VER" \
            --notes "Calendar release $VER. CLI and native desktop assets for Linux, Windows and macOS (amd64 and arm64). First launch completes desktop installation automatically."

  post_release_smoke:
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.release.result == 'success'
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Wait for release assets to be available
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release.outputs.ver }}
        run: |
          set -euo pipefail
          asset="solomon-${RELEASE_TAG}-linux-amd64"
          url="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${asset}"
          for attempt in $(seq 1 30); do
            if curl -fsI "$url" >/dev/null 2>&1; then
              echo "Release assets available (attempt ${attempt})"
              exit 0
            fi
            echo "Waiting for release assets... (${attempt}/30)"
            sleep 2
          done
          echo "Release assets not available after 60s: ${url}" >&2
          exit 1

      - name: Run README install command (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release.outputs.ver }}
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/SAPPHIR3-ROS3/Solomon/main/scripts/install.sh" | bash -s -- "${RELEASE_TAG}"

      - name: Run README install command (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release.outputs.ver }}
        run: |
          $script = irm "https://raw.githubusercontent.com/SAPPHIR3-ROS3/Solomon/main/scripts/install.ps1"
          $block = [scriptblock]::Create($script)
          & $block -Version $env:RELEASE_TAG

      - name: Smoke test installed binary (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          gopath_bin="$(go env GOPATH)/bin"
          gobin="$(go env GOBIN 2>/dev/null | tr -d '\r\n')"
          if [[ -n "$gobin" ]]; then
            expected_bin="$gobin"
          else
            expected_bin="$gopath_bin"
          fi
          case ":${PATH}:" in
            *":${expected_bin}:"*) ;;
            *)
              echo "Go install bin not in PATH: ${expected_bin}" >&2
              echo "PATH=${PATH}" >&2
              exit 1
              ;;
          esac
          if ! command -v solomon >/dev/null 2>&1; then
            echo "solomon not found in PATH" >&2
            exit 1
          fi
          solomon version
          for rc in "$HOME/.zshrc" "$HOME/.profile"; do
            [[ -f "$rc" ]] || { echo "missing ${rc}" >&2; exit 1; }
            grep -Fq '# solomon-installer-gopath' "$rc" || {
              echo "missing gopath marker in ${rc}" >&2
              exit 1
            }
            grep -Fq 'go env GOBIN' "$rc" || {
              echo "missing GOBIN handling in ${rc}" >&2
              exit 1
            }
          done
          if [[ "$(uname -s)" == Darwin ]]; then
            bash_rc="$HOME/.bash_profile"
          else
            bash_rc="$HOME/.bashrc"
          fi
          [[ -f "$bash_rc" ]] || { echo "missing ${bash_rc}" >&2; exit 1; }
          grep -Fq '# solomon-installer-gopath' "$bash_rc" || {
            echo "missing gopath marker in ${bash_rc}" >&2
            exit 1
          }
          grep -Fq 'go env GOBIN' "$bash_rc" || {
            echo "missing GOBIN handling in ${bash_rc}" >&2
            exit 1
          }
          exe="$expected_bin/solomon"
          if [[ ! -x "$exe" ]]; then
            echo "Installed binary not found at $exe" >&2
            exit 1
          fi
          "$exe" version
          case "$(uname -s)" in
            Darwin) desktop="$HOME/Applications/Solomon.app/Contents/MacOS/solomon-desktop" ;;
            Linux) desktop="$expected_bin/solomon-desktop" ;;
          esac
          [[ -x "$desktop" ]] || { echo "Desktop missing: $desktop" >&2; exit 1; }
          [[ -f "$desktop.install.json" ]] || { echo "Desktop setup marker missing" >&2; exit 1; }

      - name: Smoke test installed binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gobin = (go env GOBIN).Trim()
          if ($gobin) {
            $expectedBin = $gobin
          } else {
            $expectedBin = Join-Path (go env GOPATH) 'bin'
          }
          if ($env:Path -notlike "*$expectedBin*") {
            throw "Go install bin not in session PATH: $expectedBin"
          }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -notlike "*$expectedBin*") {
            throw "Go install bin not in user PATH: $expectedBin"
          }
          $cmd = Get-Command solomon -ErrorAction SilentlyContinue
          if (-not $cmd) {
            throw 'solomon not found in PATH'
          }
          & solomon version
          $profile = $PROFILE.CurrentUserAllHosts
          if (-not $profile) {
            $profile = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell\profile.ps1'
          }
          if (-not (Test-Path $profile)) {
            throw "PowerShell profile not found: $profile"
          }
          $content = Get-Content -Path $profile -Raw
          if (-not $content.Contains('go env GOBIN')) {
            throw 'missing GOBIN handling in PowerShell profile'
          }
          $exe = Join-Path $expectedBin 'solomon.exe'
          if (-not (Test-Path $exe)) {
            throw "Installed binary not found at $exe"
          }
          & $exe version

          $desktop = Join-Path $expectedBin 'solomon-desktop.exe'
          if (-not (Test-Path -LiteralPath $desktop)) { throw 'Desktop executable missing' }
          $link = Join-Path ([Environment]::GetFolderPath('Programs')) 'Solomon\Solomon.lnk'
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($link)
          if ($shortcut.TargetPath -ne $desktop) { throw 'Incorrect Start menu desktop target' }
          $app = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Solomon'
          if ($app.DisplayName -ne 'Solomon') { throw 'Solomon missing from Windows apps' }

      - name: Smoke test upgrade path (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release.outputs.ver }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check_upgrade_smoke.sh

      - name: Verify go install completes the desktop package (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release.outputs.ver }}
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/go-install-bin"
          mkdir -p "$GOBIN"
          for attempt in $(seq 1 15); do
            if go install "github.com/SAPPHIR3-ROS3/Solomon/v2026/cmd/solomon@${RELEASE_TAG}"; then break; fi
            if [[ "$attempt" == 15 ]]; then exit 1; fi
            sleep 2
          done
          "$GOBIN/solomon" version
          if [[ "$(uname -s)" == Darwin ]]; then
            desktop="$HOME/Applications/Solomon.app/Contents/MacOS/solomon-desktop"
            [[ "$(readlink "$(dirname "$desktop")/solomon")" == "$GOBIN/solomon" ]]
          else
            desktop="$GOBIN/solomon-desktop"
            grep -Fq "$desktop" "$HOME/.local/share/applications/solomon.desktop"
          fi
          [[ -x "$desktop" && -f "$desktop.install.json" ]]

      - name: Verify go install completes the desktop package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release.outputs.ver }}
        run: |
          $env:GOBIN = Join-Path $env:RUNNER_TEMP 'go-install-bin'
          New-Item -ItemType Directory -Force -Path $env:GOBIN | Out-Null
          for ($attempt = 1; $attempt -le 15; $attempt++) {
            go install "github.com/SAPPHIR3-ROS3/Solomon/v2026/cmd/solomon@$env:RELEASE_TAG"
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 15) { throw 'go install failed' }
            Start-Sleep -Seconds 2
          }
          & (Join-Path $env:GOBIN 'solomon.exe') version
          if ($LASTEXITCODE -ne 0) { throw 'First-launch desktop setup failed' }
          $desktop = Join-Path $env:GOBIN 'solomon-desktop.exe'
          if (-not (Test-Path -LiteralPath "$desktop.install.json")) { throw 'Desktop setup missing' }
          $link = Join-Path ([Environment]::GetFolderPath('Programs')) 'Solomon\Solomon.lnk'
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($link)
          if ($shortcut.TargetPath -ne $desktop) { throw 'go install did not register the GUI' }

      - name: Smoke test upgrade path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release.outputs.ver }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check_upgrade_smoke.ps1

      - id: asset_meta_unix
        name: Resolve release asset name (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release.outputs.ver }}
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Linux) goos="linux" ;;
            Darwin) goos="darwin" ;;
            *)
              echo "Unsupported runner OS: $(uname -s)" >&2
              exit 1
              ;;
          esac
          case "$(uname -m)" in
            x86_64) goarch="amd64" ;;
            arm64|aarch64) goarch="arm64" ;;
            *)
              echo "Unsupported runner arch: $(uname -m)" >&2
              exit 1
              ;;
          esac
          asset="solomon-${RELEASE_TAG}-${goos}-${goarch}"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Download and smoke test release asset (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release.outputs.ver }}
          ASSET_NAME: ${{ steps.asset_meta_unix.outputs.asset }}
        run: |
          set -euo pipefail
          if [[ -z "${ASSET_NAME}" ]]; then
            echo "Release asset name was not resolved" >&2
            exit 1
          fi
          exe="$RUNNER_TEMP/$ASSET_NAME"
          curl -fL "https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${ASSET_NAME}" -o "$exe"
          chmod +x "$exe"
          if [[ ! -x "$exe" ]]; then
            echo "Downloaded asset is not executable: $exe" >&2
            exit 1
          fi
          "$exe" version

      - id: asset_meta_windows
        name: Resolve release asset name (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release.outputs.ver }}
        run: |
          switch ($env:PROCESSOR_ARCHITECTURE.ToUpperInvariant()) {
            'AMD64' { $arch = 'amd64' }
            'ARM64' { $arch = 'arm64' }
            default { throw "Unsupported runner arch: $env:PROCESSOR_ARCHITECTURE" }
          }
          $asset = "solomon-$env:RELEASE_TAG-windows-$arch.exe"
          "asset=$asset" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download and smoke test release asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release.outputs.ver }}
          ASSET_NAME: ${{ steps.asset_meta_windows.outputs.asset }}
        run: |
          if (-not $env:ASSET_NAME) {
            throw 'Release asset name was not resolved'
          }
          $exe = Join-Path $env:RUNNER_TEMP $env:ASSET_NAME
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG/$env:ASSET_NAME"
          Invoke-WebRequest -Uri $url -OutFile $exe
          if (-not (Test-Path $exe)) {
            throw "Downloaded asset not found at $exe"
          }
          & $exe version
