name: Release

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      force_tests:
        description: Re-run the test suite even if this commit already passed CI
        type: boolean
        default: false
      smoke_release_tag:
        description: Only run installation and upgrade checks for an existing release tag
        type: string
        default: ""
      release_tag:
        description: Optional new calendar tag (use a new revision when replacing a withdrawn release)
        type: string
        default: ""

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && 'publish' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prior_test_status:
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_release_tag == ''
    runs-on: ubuntu-latest
    outputs:
      skip_tests: ${{ steps.check.outputs.skip_tests }}
    steps:
      - uses: actions/checkout@v7
      - name: Check release workflow permissions
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TOKEN_CONFIGURED: ${{ secrets.RELEASE_TOKEN != '' }}
        run: bash scripts/check_release_workflow_permissions.sh
      - name: Check whether this commit already passed CI
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_TESTS: ${{ inputs.force_tests }}
        run: bash scripts/check_prior_ci_tests.sh

  test:
    needs: prior_test_status
    if: |
      always() && (
        github.event_name == 'push' ||
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'workflow_dispatch' && inputs.smoke_release_tag == '' && (
            needs.prior_test_status.result == 'success' &&
            needs.prior_test_status.outputs.skip_tests != 'true'
          )
        )
      )
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
      - name: Build cursor integration bundle
        run: |
          go run scripts/cursor_bundler.go build
          go run scripts/cursor_bundler.go bundle

      - name: Build the daemon frontend
        shell: bash
        run: |
          go run ./scripts/npm_deps gui
          npm --prefix gui run build
          go run scripts/gui_bundle.go
      - run: go vet ./...
      - run: go run scripts/check_doc_paths.go
      - run: go run scripts/check_package_index.go
      - name: Verify install script GOPATH bin PATH setup (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/check_install_path.sh
      - name: Verify install script GOPATH bin PATH setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check_install_path.ps1
      - name: Verify upgrade restart flow
        shell: bash
        run: go test ./test -count=1 -run '^TestUpgradeFlow_'
      - name: Verify Windows desktop build and registration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build_desktop.ps1 -Install
          $key = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Solomon'
          if ($key.DisplayName -ne 'Solomon') { throw 'Solomon application registration missing' }
          $link = Join-Path ([Environment]::GetFolderPath('Programs')) 'Solomon\Solomon.lnk'
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($link)
          if (-not (Test-Path -LiteralPath $shortcut.TargetPath)) { throw 'Solomon Start menu target missing' }
      - name: Verify desktop process selection (Linux)
        if: runner.os == 'Linux'
        run: CGO_ENABLED=1 go test ./test -race -run '^TestCoordinatedUpdateSelectsOnlyExactDesktopExecutable$' -count=5
      - name: Run tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            CGO_ENABLED=1 go test ./... -count=1 -race -timeout 20m
          else
            go test ./... -count=1
          fi
      - name: Verify app update interactions
        if: runner.os == 'Linux'
        working-directory: gui
        env:
          SOLOMON_TEST_BROWSER: /usr/bin/google-chrome
        run: npm run test:update

      - name: Build solomon with embedded version metadata
        shell: bash
        run: |
          set -e
          if VERSION=$(git describe --tags --exact-match --match 'v*' 2>/dev/null); then
            :
          else
            BASE_VERSION=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo dev)
            VERSION="${BASE_VERSION}-dev"
          fi
          COMMIT=$(git rev-parse HEAD)
          COMMIT_TIME=$(git show -s --format=%cI HEAD)
          SOURCE_TREE=$(go run ./scripts/source_identity)
          COMMIT_TREE=$(git rev-parse 'HEAD^{tree}')
          go build -ldflags="-X github.com/SAPPHIR3-ROS3/Solomon/v2026/internal/agent/commands.version=${VERSION} -X github.com/SAPPHIR3-ROS3/Solomon/v2026/internal/agent/commands.commit=${COMMIT} -X github.com/SAPPHIR3-ROS3/Solomon/v2026/internal/agent/commands.commitTime=${COMMIT_TIME} -X github.com/SAPPHIR3-ROS3/Solomon/v2026/internal/agent/commands.sourceTree=${SOURCE_TREE} -X github.com/SAPPHIR3-ROS3/Solomon/v2026/internal/agent/commands.commitTree=${COMMIT_TREE}" ./cmd/solomon

  desktop_assets:
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.prior_test_status.result == 'success' &&
      (needs.test.result == 'success' ||
       (needs.test.result == 'skipped' && needs.prior_test_status.outputs.skip_tests == 'true'))
    needs: [prior_test_status, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows/amd64
            asset: windows-amd64.exe
          - runner: windows-latest
            platform: windows/arm64
            asset: windows-arm64.exe
          - runner: ubuntu-24.04
            platform: linux/amd64
            asset: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            asset: linux-arm64
          - runner: macos-15-intel
            platform: darwin/amd64
            asset: darwin-amd64.app.tar.gz
          - runner: macos-15
            platform: darwin/arm64
            asset: darwin-arm64.app.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build Cursor integration bundle
        run: |
          go run scripts/cursor_bundler.go build
          go run scripts/cursor_bundler.go bundle
      - name: Build native desktop
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p desktop-dist
          cd gui/desktop
          wails_version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          flags=(-skipbindings -nosyncgomod -m -platform "$PLATFORM")
          if [[ "$PLATFORM" == linux/* ]]; then flags+=(-tags webkit2_41); fi
          go run "github.com/wailsapp/wails/v2/cmd/wails@${wails_version}" build "${flags[@]}"
          if [[ "$PLATFORM" == darwin/* ]]; then
            COPYFILE_DISABLE=1 tar -czf "../../desktop-dist/solomon-desktop-${ASSET}" -C build/bin Solomon.app
          elif [[ "$PLATFORM" == windows/* ]]; then
            cp build/bin/solomon-desktop.exe "../../desktop-dist/solomon-desktop-${ASSET}"
          else
            cp build/bin/solomon-desktop "../../desktop-dist/solomon-desktop-${ASSET}"
          fi
          cd ../..
          host="$(go env GOOS)/$(go env GOARCH)"
          if [[ "$PLATFORM" == "$host" ]]; then
            tags="desktop,production"
            standalone="desktop-dist/solomon-standalone-${ASSET}"
            if [[ "$PLATFORM" == linux/* ]]; then tags="${tags},webkit2_41"; fi
            if [[ "$PLATFORM" == darwin/* ]]; then
              standalone="desktop-dist/solomon-standalone-${ASSET%.app.tar.gz}"
              export CGO_LDFLAGS="-framework UniformTypeIdentifiers${CGO_LDFLAGS:+ $CGO_LDFLAGS}"
            fi
            CGO_ENABLED=1 go build -tags "$tags" -o "$standalone" ./cmd/solomon
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.asset }}
          path: desktop-dist/*

  release:
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.prior_test_status.result == 'success' &&
      needs.desktop_assets.result == 'success' &&
      (
        needs.test.result == 'success' ||
        (
          needs.test.result == 'skipped' &&
          needs.prior_test_status.outputs.skip_tests == 'true'
        )
      )
    needs: [prior_test_status, test, desktop_assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ver: ${{ steps.version.outputs.ver }}
      previous_tag: ${{ steps.baseline.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true

      - name: Build cursor integration bundle
        run: |
          go run scripts/cursor_bundler.go build
          go run scripts/cursor_bundler.go bundle

      - name: Build the daemon frontend
        shell: bash
        run: |
          go run ./scripts/npm_deps gui
          npm --prefix gui run build
          go run scripts/gui_bundle.go

      - id: version
        name: Resolve calendar version tag
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -e
          git fetch --tags origin
          Y=$(date -u +%Y)
          M=$((10#$(date -u +%m)))
          D=$((10#$(date -u +%d)))
          MD=$((M * 100 + D))
          PREFIX="v${Y}.${MD}"

          MAX_REV=-1
          for t in $(git tag -l "${PREFIX}.*"); do
            SUF=${t#"$PREFIX."}
            if [[ "$SUF" =~ ^[0-9]+$ ]] && ((10#$SUF > MAX_REV)); then
              MAX_REV=$((10#$SUF))
            fi
          done
          REV=$((MAX_REV + 1))
          VER="${PREFIX}.${REV}"

          if [[ -n "$REQUESTED_RELEASE_TAG" ]]; then
            REQUESTED_REV=${REQUESTED_RELEASE_TAG#"$PREFIX."}
            if [[ "$REQUESTED_RELEASE_TAG" != "$PREFIX."* || ! "$REQUESTED_REV" =~ ^(0|[1-9][0-9]*)$ ]]; then
              echo "release_tag must use today's calendar prefix: ${PREFIX}.<revision>" >&2
              exit 1
            fi
            if ((10#$REQUESTED_REV <= MAX_REV)); then
              echo "release_tag must be newer than every existing tag for today" >&2
              exit 1
            fi
            VER="$REQUESTED_RELEASE_TAG"
          fi

          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Prepare release source with embedded assets
        env:
          VER: ${{ steps.version.outputs.ver }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # go install builds the tagged source without running our bundlers.
          # Keep generated assets in the release commit, off the development branch.
          git add -f internal/integrations/cursor/bundle gui/assets/frontend
          git commit -m "build: include embedded assets for $VER"

      - name: Verify release source archive builds without bundlers
        run: bash scripts/check_release_source.sh

      - name: Record current stable release
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/"$GITHUB_REPOSITORY"/releases/latest --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          VER: ${{ steps.version.outputs.ver }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TOKEN_CONFIGURED: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          set -e
          # Check again in case the default branch advanced during the builds.
          bash scripts/check_release_workflow_permissions.sh
          git tag -a "$VER" -m "Calendar release $VER"
          git push origin "$VER"
          echo "Pushed tag $VER"

      - name: Build release executables
        env:
          VER: ${{ steps.version.outputs.ver }}
        run: |
          set -e
          # Capture the source tree before creating release outputs or stamping versions.
          SOURCE_TREE=$(go run ./scripts/source_identity)
          COMMIT_TREE=$(git rev-parse 'HEAD^{tree}')
          COMMIT=$(git rev-parse HEAD)
          mkdir -p dist
          for spec in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            goos="${spec%/*}"
            goarch="${spec#*/}"
            out="dist/solomon-${VER}-${goos}-${goarch}"
            if [ "$goos" = "windows" ]; then
              out="${out}.exe"
            fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="-s -w -X github.com/SAPPHIR3-ROS3/Solomon/v2026/internal/agent/commands.version=$VER -X github.com/SAPPHIR3-ROS3/Solomon/v2026/internal/agent/commands.commit=$COMMIT -X github.com/SAPPHIR3-ROS3/Solomon/v2026/internal/agent/commands.sourceTree=$SOURCE_TREE -X github.com/SAPPHIR3-ROS3/Solomon/v2026/internal/agent/commands.commitTree=$COMMIT_TREE" -o "$out" ./cmd/solomon
          done

      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: desktop-dist
          merge-multiple: true

      - name: Collect native desktop executables
        env:
          VER: ${{ steps.version.outputs.ver }}
        run: |
          set -e
          for asset in desktop-dist/solomon-desktop-*; do
            [ -e "$asset" ] || continue
            suffix=${asset##*/solomon-desktop-}
            cp "$asset" "dist/solomon-desktop-${VER}-${suffix}"
          done
          for asset in desktop-dist/solomon-standalone-*; do
            [ -e "$asset" ] || continue
            suffix=${asset##*/solomon-standalone-}
            cp "$asset" "dist/solomon-standalone-${VER}-${suffix}"
          done

      - name: Generate release checksums
        env:
          VER: ${{ steps.version.outputs.ver }}
        run: |
          set -e
          (
            cd dist
            sha256sum solomon-* > checksums.txt
          )

      - name: Create GitHub release
        env:
          VER: ${{ steps.version.outputs.ver }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          bash scripts/release/publish.sh

  post_release_smoke:
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      (needs.release.result == 'success' || inputs.smoke_release_tag != '')
    needs: release
    permissions:
      contents: write
      actions: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/smoke
        env:
          RELEASE_TAG: ${{ inputs.smoke_release_tag || needs.release.outputs.ver }}

      - name: Withdraw failed release immediately
        if: ${{ always() && (failure() || cancelled()) && inputs.smoke_release_tag == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.ver }}
          PREVIOUS_TAG: ${{ needs.release.outputs.previous_tag }}
        run: bash scripts/release/rollback.sh

      - name: Clean failed release build artifacts
        if: ${{ always() && (failure() || cancelled()) && inputs.smoke_release_tag == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/cleanup.sh

  rollback:
    needs: [release, post_release_smoke]
    if: ${{ always() && needs.release.result == 'success' && inputs.smoke_release_tag == '' && needs.post_release_smoke.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Ensure failed release is withdrawn
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.ver }}
          PREVIOUS_TAG: ${{ needs.release.outputs.previous_tag }}
        run: bash scripts/release/rollback.sh

  cleanup:
    needs: [desktop_assets, release, post_release_smoke, rollback]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.smoke_release_tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Delete temporary desktop build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/cleanup.sh
